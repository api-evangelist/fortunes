name: Fortunes
description: >-
  ForTunes was a Vienna-based mobile music data analytics application for
  self-publishing and DIY artists, managers, and small labels. The app
  collected and visualized performance data across Spotify, Apple Music,
  SoundCloud, YouTube, Instagram, Facebook, and other platforms into a single
  intelligent feed, with notifications for playlist adds and follower growth,
  a Spotify playlist recommendation engine, public artist profiles, and team
  collaboration. Backed by Speedinvest (2018), the company was acquired by
  Utopia Music in 2023. As of this profile the primary web domain
  (fortunes.io) no longer resolves and no public developer API, API
  documentation, or developer portal is published; the product surface is the
  consumer iOS and Android apps.
